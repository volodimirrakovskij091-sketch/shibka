const sty=a=>{const p=PAL[a.p%5];return`--c1:${p[0]};--c2:${p[1]};--tx:${p[2]?'#F8EDCF':'#2B1A0C'}`+(a.img?`;--tc:#FFF6DC;--ov:linear-gradient(to top,rgba(30,15,0,.78),transparent 52%),linear-gradient(to bottom,rgba(30,15,0,.5),transparent 28%),url("${encodeURI(a.img)}")`:'')};
function measure(){const p=document.createElement('div');p.style.cssText='position:fixed;left:-99px;height:var(--H)';document.body.append(p);H=p.offsetHeight;p.remove();ws=H*142/840;d=H*474/900;gap=H*.03;st.style.setProperty('--ws',ws+'px');st.style.setProperty('--d',d+'px')}
function build(keep){list=ARTICLES.filter(a=>(F.cat=='all'||a.cat==F.cat)&&(!F.issue||a.issue==F.issue));n=list.length;tapes=[];st.innerHTML='';$('empty').style.display=n?'none':'grid';
 if(!n){['t','s','y'].forEach(c=>document.querySelector('.cl.'+c).innerHTML='');act=-1;return}
 let c=Math.max(3,Math.ceil(30/n));if(c%2==0)c++;M=n*c;
 for(let v=0;v<M;v++){const a=list[v%n],i=v%n,e=document.createElement('div');e.className='tape';e.style.cssText=sty(a);
  e.innerHTML=`<div class="f sp"><b>${L(a.title)}</b><span class="lbl">Шибка</span></div><div class="f cv ci">${cvH(a,i)}</div>`;
  const o={el:e,v,lift:0,r:0,sp:e.children[0],cv:e.children[1],hid:false};e._o=o;
  e.addEventListener('pointerenter',()=>hover=v);e.addEventListener('pointerleave',()=>hover=-1);tapes.push(o);st.append(e)}
 if(!keep){s=T=Math.floor(c/2)*n+Math.min(n-1,Math.floor(n/2))}act=-1;cap(0,true)}
function cap(dir,first){if(!n)return;const i=mod(Math.round(s),n);if(i==act&&!first)return;act=i;const a=list[i];
 const row=[['t',L(a.title)],['s',`${t(a.cat)} / №${a.issue} / ${a.author}`],['y',a.date.slice(0,4)+' · '+a.date.slice(5)+'']];
 row.forEach(([c,x])=>{const el=document.querySelector('.cl.'+c),sp=document.createElement('span');sp.textContent=x;
  [...el.children].forEach(o=>{if(o._l)return;o._l=1;if(R){o.remove();return}const an=o.animate([{transform:getComputedStyle(o).transform},{transform:`translateY(${-dir*105}%)`}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});an.onfinish=()=>o.remove()});
  el.append(sp);if(!first&&!R)sp.animate([{transform:`translateY(${(dir||1)*105}%)`},{transform:'none'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'})})}
function tabs(){const tb=$('tabs');tb.innerHTML='<i id="ind"></i>'+cats.map(c=>`<button class="tb lbl ${F.cat==c?'on':''}" data-c="${c}">${t(c)}</button>`).join('')+(F.issue?`<button class="tb lbl" data-c="x" style="color:var(--acc)">№${F.issue} ✕</button>`:'');
 tb.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{if(b.dataset.c=='x')F.issue=null;else F.cat=b.dataset.c;tabs();build()});
 const on=tb.querySelector('.on'),i=$('ind');if(on){i.style.width=on.offsetWidth+'px';i.style.transform=`translateX(${on.offsetLeft}px)`}}
const Fx=r=>{const a=Math.abs(r),B=a<1?(r+Math.sin(Math.PI*r)/Math.PI)/2:Math.sign(r)*.5;return r*(ws+gap)+(d-ws+1.6*gap)*B};
let last=performance.now();
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;const W=innerWidth,vh=innerHeight,cyS=vh/2;
 if(n){const k=R?1:drag?18:5.2;s+=(T-s)*(1-Math.exp(-k*dt));if(Math.abs(T-s)<1e-4)s=T;if(s>M){s-=M;T-=M}if(s<0){s+=M;T+=M}
  cap(Math.sign(T-s)||1);
  const dx=mx-W/2,dy=my-cyS;onCover=!isOpen&&!viewOpen&&Math.abs(dx)<.55*d&&Math.abs(dy)<.55*H&&Math.abs(T-s)<.3;
  const ty=onCover?dx/(.55*d)*9:dx/W*5,tx=onCover?-dy/(H/2)*6:0,kt=R?1:1-Math.exp(-7*dt);tiltY+=(ty-tiltY)*kt;tiltX+=(tx-tiltX)*kt;
  tapes.forEach(o=>{const r=mod(o.v-s+M/2,M)-M/2,ar=Math.abs(r);o.r=r;const x=Fx(r),hid=Math.abs(x)>W/2+1.5*d;
   if(hid!=o.hid){o.hid=hid;o.el.style.visibility=hid?'hidden':'visible'}if(hid)return;
   o.lift+=((hover==o.v&&ar>.5?1:0)-o.lift)*(R?1:1-Math.exp(-12*dt));const op=ss(Math.max(0,1-ar));
   o.el.style.transform=`translate3d(${x}px,${-op*.025*H-o.lift*.045*H}px,${op*.2*H}px) rotateZ(${-4.5*op}deg) rotateX(${tiltX*op}deg) rotateY(${-90*op+tiltY*op}deg)`;
   o.el.style.zIndex=Math.round(100-ar*4);o.sp.style.setProperty('--shade',op*.55);o.cv.style.setProperty('--shade',(1-op)*.5)});
  const pr=isOpen||viewOpen?0:ss(Math.max(0,1-Math.abs(T-s)*3)),p=$('play');p.style.left=W/2-.5*d-6+'px';p.style.top=cyS+.36*H+'px';p.style.transform=`scale(${pr})`}
 cx+=(mx-cx)*(1-Math.exp(-16*dt));cy+=(my-cy)*(1-Math.exp(-16*dt));cur.style.transform=`translate3d(${cx}px,${cy}px,0)`;
 cur.classList.toggle('open',onCover);requestAnimationFrame(tick)}
/* ============ ВХІД / INPUT ============ */
const go=v=>{if(isOpen||viewOpen||!n)return;T=v};
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;const el=e.target,tp=el.closest&&el.closest('.tape');
 cur.classList.toggle('btn',!!(el.closest&&el.closest('button,a,input,.opt'))&&!tp);cur.classList.toggle('spine',!!tp&&!onCover&&!isOpen&&!viewOpen)});
$('pv').onclick=()=>go(Math.round(T)-1);$('nx').onclick=()=>go(Math.round(T)+1);
addEventListener('wheel',e=>{if(isOpen||viewOpen||!n)return;const dl=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;T+=dl/(ws+gap)*.5;clearTimeout(wt);wt=setTimeout(()=>T=Math.round(T),160)},{passive:true});
let dx0=0,T0=0,dn=false;
$('shelf').addEventListener('pointerdown',e=>{dn=true;dx0=e.clientX;T0=T;drag=false});
addEventListener('pointermove',e=>{if(!dn||isOpen||viewOpen)return;const dx=e.clientX-dx0;if(!drag&&Math.abs(dx)>5)drag=true;if(drag)T=T0-dx/(ws+gap)});
addEventListener('pointerup',()=>{if(dn&&drag)T=Math.round(T);dn=false;setTimeout(()=>drag=false,0)});
st.addEventListener('click',e=>{if(drag||isOpen||viewOpen)return;const tp=e.target.closest('.tape');if(!tp)return;const o=tp._o;if(Math.abs(o.r)<.5)openA();else T=Math.round(T+o.r)});
$('play').onclick=()=>openA();
addEventListener('keydown',e=>{if(e.key=='Escape')closeA();if(isOpen||viewOpen)return;if(e.key=='ArrowLeft')go(Math.round(T)-1);if(e.key=='ArrowRight')go(Math.round(T)+1);if(e.key=='Enter'&&document.activeElement==document.body&&n)openA()});
/* ============ СТАТТЯ / DETAIL ============ */
const det=$('det');let ani=[];
function coverRect(){let b=null;tapes.forEach(o=>{if(!b||Math.abs(o.r)<Math.abs(b.r))b=o});return b.cv.getBoundingClientRect()}
const clipOf=r=>`inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round 3px)`;
function openA(){if(!n||isOpen)return;T=Math.round(T);const a=list[mod(Math.round(T),n)],i=mod(Math.round(T),n),r=coverRect();isOpen=true;
 const p=PAL[a.p%5];$('dpz').style.cssText=sty(a);$('dpz').innerHTML=cvH(a,i);
 $('dtx').innerHTML=[`<span class="lbl" style="color:var(--acc)">${t(a.cat)} / №${a.issue}</span>`,`<h2>${L(a.title)}</h2>`,`<span class="lbl" style="color:var(--muted)">${a.author}, ${a.age} · ${a.date}</span>`,`<p class="lead">${L(a.lead)}</p>`,...L(a.body).map(x=>`<p>${x}</p>`)].map(x=>`<div class="m">${x}</div>`).join('');
 det.style.visibility='visible';det.style.transformOrigin=`${(r.left+r.right)/2}px ${(r.top+r.bottom)/2}px`;
 ani=[det.animate([{clipPath:clipOf(r),transform:'rotate(-4.5deg)'},{clipPath:'inset(0 0 0 0 round 0)',transform:'rotate(0)'}],{duration:du(1050),easing:'cubic-bezier(.76,0,.18,1)',fill:'both'})];
 document.querySelectorAll('#dtx .m>*').forEach((el,k)=>ani.push(el.animate([{transform:'translateY(110%)'},{transform:'none'}],{duration:du(900),delay:R?0:620+k*75,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'})));
 ani.push($('dpz').animate([{clipPath:'inset(100% 0 0 0)'},{clipPath:'inset(0)'}],{duration:du(1250),delay:R?0:520,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'}));
 cur.classList.remove('open','spine')}
function closeA(){if(!isOpen)return;const r=coverRect();isOpen=false;
 const an=det.animate([{clipPath:'inset(0 0 0 0 round 0)',transform:'rotate(0)'},{clipPath:clipOf(r),transform:'rotate(-4.5deg)'}],{duration:du(850),easing:'cubic-bezier(.76,0,.18,1)',fill:'both'});
 an.onfinish=()=>{det.style.visibility='hidden';ani.forEach(a=>a.cancel());an.cancel()}}
$('x').onclick=closeA;
/* ============ СТОРІНКИ / VIEWS ============ */
const NAV=['articles','issues','polls','about','partners','support','subscribe'];
function votes(p){let v={};try{v=JSON.parse(localStorage['v_'+p.id]||'null')||{}}catch(e){}return v}
function pollH(p){const mine=votes(p),has=mine.i!=null,tot=p.o.reduce((a,o,i)=>a+o.v+(mine.i==i?1:0),0);
 return`<div class="card" style="width:100%"><h3>${L(p.q)}</h3><div style="width:100%">${p.o.map((o,i)=>{const v=o.v+(mine.i==i?1:0);return`<button class="opt" data-p="${p.id}" data-i="${i}"><i style="width:${has?Math.round(v/tot*100):0}%"></i><span>${L(o.t)}${has?' — '+Math.round(v/tot*100)+'%':''}</span></button>`}).join('')}</div>${has?`<span class="lbl" style="color:var(--muted)">${tot} ${t('votes')}</span>`:''}</div>`}
function views(){const V={
issues:`<h1>${t('issues')}</h1><div class="g">${ISSUES.map(i=>`<div class="card"><span class="lbl" style="color:var(--acc)">${t('issue')} №${i.n} · ${i.date}</span><h3>${L(i.t)}</h3><p>${ARTICLES.filter(a=>a.issue==i.n).length} ${lang=='uk'?'статей':'articles'}</p><button class="box lbl" data-is="${i.n}">${t('read')}</button></div>`).join('')}</div>`,
polls:`<h1>${t('polls')}</h1><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${POLLS.map(pollH).join('')}</div>`,
about:`<h1>${t('aboutT')}</h1><h2>${t('who')}</h2><p>${t('whoP')}</p><h2>${t('hist')}</h2><p>${t('histP')}</p><h2>${t('miss')}</h2><p>${t('missP')}</p><h2>${t('why')}</h2><p>${t('whyP')}</p><h2>${t('team')}</h2><div class="g">${TEAM.map(m=>`<div class="card"><h3>${m.n}</h3><span class="lbl" style="color:var(--acc)">${L(m.r)}</span></div>`).join('')}</div>`,
partners:`<h1>${t('partT')}</h1><div class="g">${PARTNERS.map(p=>`<div class="card"><span class="lbl" style="color:var(--acc)">${p.y}</span><h3>${p.n}</h3><p>${L(p.d)}</p></div>`).join('')}</div>`,
support:`<h1>${t('supT')}</h1><p>${t('supP')}</p>${CFG.donate?`<a class="btn lbl" href="${CFG.donate}" target="_blank" rel="noopener">${t('donate')}</a>`:''}<div class="card" style="margin-top:22px;max-width:420px"><span class="lbl" style="color:var(--acc)">${t('ibanL')}</span><h3 style="font-size:20px">${CFG.iban}</h3></div>`,
subscribe:`<h1>${t('subT')}</h1><p>${t('subP')}</p><form id="sf"><input type="email" required placeholder="${t('email')}" id="se"> <button class="btn lbl" type="submit">${t('send')}</button></form><p id="sm" class="lbl" style="margin-top:14px"></p><p style="margin-top:30px">${t('contact')}: <a href="mailto:${CFG.email}" style="color:var(--acc)">${CFG.email}</a></p>`};
 $('views').innerHTML=NAV.slice(1).map(k=>`<section class="view" id="v-${k}" aria-label="${k}"><div class="w">${V[k]}</div></section>`).join('');
 document.querySelectorAll('[data-is]').forEach(b=>b.onclick=()=>{F.issue=+b.dataset.is;F.cat='all';tabs();build();nav('articles')});
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const p=POLLS.find(x=>x.id==b.dataset.p);if(votes(p).i!=null)return;try{localStorage['v_'+p.id]=JSON.stringify({i:+b.dataset.i})}catch(e){}const k=location.hash;views();route()});
 const sf=$('sf');if(sf)sf.onsubmit=async e=>{e.preventDefault();const m=$('se').value;
  if(CFG.formEndpoint){try{await fetch(CFG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({email:m})});$('sm').textContent=t('thanks')}catch(x){location.href=`mailto:${CFG.email}?subject=Subscribe&body=${m}`}}
  else{location.href=`mailto:${CFG.email}?subject=${encodeURIComponent('Підписка / Subscribe')}&body=${encodeURIComponent(m)}`;$('sm').textContent=t('thanks')}}}
let cv=location.hash.slice(1);if(!NAV.includes(cv))cv='articles';
function nav(h){try{history.replaceState(null,'','#'+h)}catch(e){}route(h)}
function route(h){h=h||cv;cv=h;viewOpen=h!='articles'&&NAV.includes(h);
 document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id=='v-'+h));
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#'+h));if(!n)return;
 document.querySelector('#nav a.on')?.scrollIntoView?.({inline:'center',block:'nearest'})}
function ui(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('nav').innerHTML=NAV.map(k=>`<a class="box lbl" href="#${k}">${t(k)}</a>`).join('');$('lg').textContent=lang=='uk'?'EN':'UA';tabs();views();route()}
$('lg').onclick=()=>{lang=lang=='uk'?'en':'uk';try{localStorage.lang=lang}catch(e){}if(isOpen)closeA();ui();const keep=T,ks=s;build(true);T=keep;s=ks}
addEventListener('hashchange',()=>route(location.hash.slice(1)||'articles'));
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();if(isOpen)closeA();nav(a.getAttribute('href').slice(1))});addEventListener('resize',()=>{measure();tabs()});
new Image().src='';measure();ui();build();route();document.fonts&&document.fonts.ready.then(tabs);requestAnimationFrame(tick);
</script></body></html>
